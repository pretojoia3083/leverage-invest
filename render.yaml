services:
  - type: web
    name: leverage-invest
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://leverageinvest.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MT5_BRIDGE_URL
        value: wss://leverageinvest-bridge.onrender.com
