services:
  - type: web
    name: leverage-invest
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        value: leverage-invest-2024-secret
      - key: PYTHON_VERSION
        value: "3.11.0"
